services:
  portal-db:
    image: postgres:16
    environment:
      POSTGRES_DB: labportal
      POSTGRES_USER: portal_app
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - portal_pg_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro

  api:
    build: .
    container_name: labportal-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - portal-db
    restart: unless-stopped

  # sync-worker: Terra-ს სინქრონიზაცია გაჩერებულია (2026-07-30) — იგივე
  # მონაცემები 1C-დან მოდის. აღდგენისთვის უბრალოდ მოხსენით კომენტარი.
  # sync-worker:
  #   build: .
  #   command: ["python3", "sync_worker.py"]
  #   env_file: .env
  #   depends_on:
  #     - portal-db

  # onec-sync-worker: 1C-ის periodic incremental sync (ბოლო
  # ONEC_SYNC_WINDOW_DAYS დღე, გლობალურად). loop() თვითონ იძინებს
  # ONEC_SYNC_INTERVAL_SECONDS-ს შორის, ცალკე scheduler არ სჭირდება.
  onec-sync-worker:
    build: .
    container_name: labportal-onec-sync-worker
    command: ["python3", "onec_sync_worker.py"]
    env_file: .env
    depends_on:
      - portal-db
    restart: unless-stopped

secrets:
  pg_password:
    file: ./secrets/pg_password.txt

volumes:
  portal_pg_data: